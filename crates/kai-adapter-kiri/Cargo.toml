description = "Kai's driven adapter for the Kiri engine: the ContainerRuntime and EngineEventSource ports over Kiri's Docker Engine API socket."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kai-domain = { path = "../kai-domain" }
